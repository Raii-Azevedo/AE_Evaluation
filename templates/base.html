<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AE Evaluation - Django</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
    nav { background: #0f172a; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; }
    nav a { color: #fff; margin-right: 12px; text-decoration: none; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px; }
    .ok { background: #dcfce7; color: #166534; }
    .warn { background: #fef3c7; color: #92400e; }
    .danger { background: #fee2e2; color: #991b1b; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; border-bottom: 1px solid #e5e7eb; padding: 8px; }
    input, select, textarea { width: 100%; padding: 8px; margin: 6px 0; border-radius: 8px; border: 1px solid #d1d5db; box-sizing: border-box; }
    button { background: #2563eb; border: none; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .messages { list-style: none; padding: 0; }
    .messages li { background: #e0f2fe; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <nav>
    <div>
      <a href="{% url 'home' %}">Home</a>
      <a href="/admin/">Admin</a>
      {% if can_manage_emails %}
      <a href="{% url 'manage_emails' %}">Emails</a>
      {% endif %}
    </div>
    <div>
      {% if user.is_authenticated %}
      {{ user.email }} | <a href="{% url 'logout' %}">Sair</a>
      {% else %}
      <a href="{% url 'login' %}">Entrar</a>
      {% endif %}
    </div>
  </nav>

  <div class="container">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
