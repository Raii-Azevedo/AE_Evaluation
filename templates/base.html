<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Artefact Evaluation{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS ── */
    :root {
      --orange:     #E8450A;
      --orange-dim: rgba(232,69,10,0.15);
      --orange-mid: rgba(232,69,10,0.25);
      --bg:         #0A0A0A;
      --bg-card:    #141414;
      --bg-raised:  #1A1A1A;
      --border:     rgba(255,255,255,0.08);
      --border-hi:  rgba(255,255,255,0.14);
      --text:       #FFFFFF;
      --text-muted: rgba(255,255,255,0.45);
      --text-faint: rgba(255,255,255,0.22);
    }

    /* ── BASE ── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

    /* ── NAV ── */
    nav {
      background: #0A0A0A;
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-left  { display: flex; align-items: center; gap: 32px; }
    .nav-brand {
      font-weight: 900;
      font-size: 15px;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-brand .brand-dot {
      width: 8px; height: 8px;
      background: var(--orange);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .nav-links { display: flex; gap: 2px; }
    .nav-links a {
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color .12s, background .12s;
    }
    .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .nav-right { color: var(--text-muted); font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .nav-right a { color: var(--text-muted); text-decoration: none; transition: color .12s; }
    .nav-right a:hover { color: var(--text); }
    .nav-divider { color: var(--border-hi); }

    /* ── LAYOUT ── */
    .container { max-width: 1160px; margin: 32px auto; padding: 0 24px; }

    /* ── CARD ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 14px;
      transition: border-color .15s;
    }
    .card:hover { border-color: var(--border-hi); }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }
    .card h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .card h2 { margin: 0 0 16px; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9); }
    .card h3 { margin: 0 0 10px; font-size: 11px; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: .8px; }

    /* ── STATS GRID ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .stat-card {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      transition: border-color .15s;
    }
    .stat-card:hover { border-color: var(--orange); }
    .stat-value { font-size: 32px; font-weight: 900; color: var(--orange); line-height: 1; letter-spacing: -1.5px; }
    .stat-label { font-size: 10px; color: var(--text-faint); margin-top: 6px; text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }

    /* ── TABLE ── */
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: .8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      text-align: left;
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    .table-empty td { text-align: center; color: var(--text-faint); padding: 40px; font-size: 13px; }

    /* ── FORMS ── */
    .form-group { margin-bottom: 14px; }
    .form-grid  { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-faint);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .6px;
    }
    p > label { font-size: 10px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: .6px; }
    input[type=text], input[type=email], input[type=number], input[type=url],
    select, textarea {
      width: 100%;
      padding: 9px 13px;
      border-radius: 8px;
      border: 1px solid var(--border-hi);
      background: var(--bg-raised);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color .12s, box-shadow .12s;
      margin: 0;
    }
    input::placeholder, textarea::placeholder { color: var(--text-faint); }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-dim);
    }
    select option { background: #1A1A1A; color: #fff; }
    input[type=checkbox] { width: auto; margin-right: 6px; accent-color: var(--orange); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
      font-family: inherit;
      line-height: 1;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--orange);
      color: #fff;
    }
    .btn-primary:hover { background: #d03d09; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--bg-raised);
      color: rgba(255,255,255,0.8);
      border: 1px solid var(--border-hi);
    }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
    .btn-danger {
      background: rgba(220,38,38,0.15);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.2);
    }
    .btn-danger:hover { background: rgba(220,38,38,0.25); }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); border-color: var(--border-hi); }
    .btn-sm { padding: 5px 13px; font-size: 12px; border-radius: 6px; }
    /* plain <button> fallback */
    button {
      background: var(--orange);
      border: none;
      color: #fff;
      padding: 9px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      transition: all .15s;
    }
    button:hover { background: #d03d09; transform: translateY(-1px); }

    /* ── BADGES ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
      white-space: nowrap;
    }
    .badge-green  { background: rgba(22,163,74,0.18);  color: #4ade80; border: 1px solid rgba(74,222,128,0.18); }
    .badge-red    { background: rgba(220,38,38,0.18);  color: #f87171; border: 1px solid rgba(248,113,113,0.18); }
    .badge-yellow { background: rgba(234,179,8,0.18);  color: #fde047; border: 1px solid rgba(253,224,71,0.18); }
    .badge-blue   { background: rgba(59,130,246,0.18); color: #93c5fd; border: 1px solid rgba(147,197,253,0.18); }
    .badge-gray   { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.5); border: 1px solid var(--border); }
    .badge-orange { background: var(--orange-dim); color: #fb923c; border: 1px solid rgba(232,69,10,0.3); }

    /* ── MESSAGES ── */
    .messages { list-style: none; padding: 0; margin: 0 0 16px; }
    .messages li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      border-width: 1px;
      border-style: solid;
    }
    .messages li::before { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
    .messages li.success  { background: rgba(22,163,74,0.12);  color: #4ade80; border-color: rgba(74,222,128,0.2); }
    .messages li.success::before { content: "✓"; }
    .messages li.error    { background: rgba(220,38,38,0.12);  color: #f87171; border-color: rgba(248,113,113,0.2); }
    .messages li.error::before { content: "✕"; }
    .messages li.warning  { background: rgba(234,179,8,0.12);  color: #fde047; border-color: rgba(253,224,71,0.2); }
    .messages li.warning::before { content: "⚠"; }
    .messages li.info, .messages li:not([class]) {
      background: var(--orange-dim); color: #fdba74; border-color: rgba(232,69,10,0.3);
    }
    .messages li.info::before, .messages li:not([class])::before { content: "ℹ"; }

    /* ── FILTER TABS ── */
    .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-tabs a {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: var(--text-muted);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      transition: all .12s;
    }
    .filter-tabs a:hover { color: var(--text); border-color: var(--border-hi); }
    .filter-tabs a.active {
      background: var(--orange);
      color: #fff;
      border-color: transparent;
    }

    /* ── SCORES ── */
    .score { font-weight: 800; font-size: 14px; }
    .score-high { color: #4ade80; }
    .score-mid  { color: #fbbf24; }
    .score-low  { color: #f87171; }
    .score-none { color: var(--text-faint); font-style: italic; font-weight: 400; }

    /* ── CRITERIA / BLOCO ── */
    .bloco-section { margin-bottom: 0; }
    .bloco-header {
      font-size: 11px;
      font-weight: 800;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 12px;
      padding: 8px 14px;
      background: var(--orange-dim);
      border-radius: 6px;
      border-left: 3px solid var(--orange);
    }
    .criterio-row {
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      background: var(--bg-raised);
      transition: border-color .12s;
    }
    .criterio-row:focus-within { border-color: var(--orange); }
    .criterio-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .criterio-inputs { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: start; }
    .peso-badge {
      font-size: 10px;
      font-weight: 700;
      background: var(--orange-dim);
      color: #fdba74;
      padding: 2px 8px;
      border-radius: 4px;
      flex-shrink: 0;
      border: 1px solid rgba(232,69,10,0.25);
    }

    /* ── MISC ── */
    a { color: var(--orange); text-decoration: none; }
    a:hover { color: #fb923c; }
    .link-action {
      color: var(--orange);
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 6px;
      transition: background .12s, color .12s;
    }
    .link-action:hover { background: var(--orange-dim); color: #fb923c; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      transition: color .12s;
    }
    .back-link:hover { color: var(--text); }
    .section-meta {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 5px;
    }
    .section-meta a { color: var(--orange); }
    .section-meta a:hover { color: #fb923c; }
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 12px; }
    .mb-0 { margin-bottom: 0; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .container { padding: 0 16px; margin-top: 20px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .criterio-inputs { grid-template-columns: 1fr; }
      nav { padding: 0 16px; }
      .nav-links a { padding: 5px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="{% url 'home' %}" class="nav-brand">
        <span class="brand-dot"></span>
        Artefact Evaluation
      </a>
      <div class="nav-links">
        <a href="{% url 'home' %}">Dashboard</a>
      </div>
    </div>
    <div class="nav-right">
      {% if user.is_authenticated %}
        <span>{{ user.email }}</span>
        <span class="nav-divider">·</span>
        <a href="{% url 'logout' %}">Sair</a>
      {% else %}
        <a href="{% url 'login' %}">Entrar</a>
      {% endif %}
    </div>
  </nav>

  <div class="container">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
