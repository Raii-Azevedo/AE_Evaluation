<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}AE Evaluation{% endblock %}</title>
  <style>
    /* ── BASE ── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      background-attachment: fixed;
      color: #fff;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.32); }

    /* ── NAV ── */
    nav {
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 54px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-left  { display: flex; align-items: center; gap: 24px; }
    .nav-brand {
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.3px;
    }
    .nav-brand span { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .nav-links { display: flex; gap: 2px; }
    .nav-links a {
      color: rgba(255,255,255,0.55);
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color .15s, background .15s;
    }
    .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-right { color: rgba(255,255,255,0.5); font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .nav-right a { color: rgba(255,255,255,0.5); text-decoration: none; transition: color .15s; }
    .nav-right a:hover { color: #fff; }
    .nav-divider { color: rgba(255,255,255,0.15); }

    /* ── LAYOUT ── */
    .container { max-width: 1140px; margin: 32px auto; padding: 0 20px; }

    /* ── CARD (glass) ── */
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 22px 26px;
      margin-bottom: 16px;
      transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
    }
    .card h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
    .card h2 { margin: 0 0 16px; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9); }
    .card h3 { margin: 0 0 10px; font-size: 12px; font-weight: 700; color: #a78bfa; text-transform: uppercase; letter-spacing: .6px; }

    /* ── STATS GRID ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .stat-card {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 18px 20px;
      text-align: center;
      transition: transform .2s;
    }
    .stat-card:hover { transform: translateY(-3px); }
    .stat-value { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; letter-spacing: -1px; }
    .stat-label { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 6px; text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }

    /* ── TABLE ── */
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: rgba(0,0,0,0.2); }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: .7px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      white-space: nowrap;
    }
    td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: rgba(255,255,255,0.05); }
    .table-empty td { text-align: center; color: rgba(255,255,255,0.3); padding: 36px; font-size: 13px; }

    /* ── FORMS ── */
    .form-group { margin-bottom: 14px; }
    .form-grid  { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    p > label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: .5px; }
    input[type=text], input[type=email], input[type=number], input[type=url],
    select, textarea {
      width: 100%;
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s, background .15s;
      margin: 0;
    }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.3); }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
    }
    select option { background: #1a1a2e; color: #fff; }
    input[type=checkbox] { width: auto; margin-right: 6px; accent-color: #667eea; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      font-family: inherit;
      line-height: 1;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      box-shadow: 0 4px 15px rgba(102,126,234,0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.45); }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.16); }
    .btn-danger {
      background: rgba(220,38,38,0.18);
      color: #f87171;
      border: 1px solid rgba(248,113,113,0.25);
    }
    .btn-danger:hover { background: rgba(220,38,38,0.28); }
    .btn-ghost {
      background: transparent;
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .btn-sm { padding: 5px 13px; font-size: 12px; border-radius: 7px; }
    /* plain <button> fallback */
    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: #fff;
      padding: 9px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      transition: all .2s;
      box-shadow: 0 4px 15px rgba(102,126,234,0.25);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }

    /* ── BADGES ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
      white-space: nowrap;
    }
    .badge-green  { background: rgba(22,163,74,0.22);  color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
    .badge-red    { background: rgba(220,38,38,0.22);  color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
    .badge-yellow { background: rgba(234,179,8,0.22);  color: #fde047; border: 1px solid rgba(253,224,71,0.2); }
    .badge-blue   { background: rgba(99,102,241,0.25); color: #a5b4fc; border: 1px solid rgba(165,180,252,0.2); }
    .badge-gray   { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.1); }
    .badge-purple { background: rgba(168,85,247,0.22); color: #d8b4fe; border: 1px solid rgba(216,180,254,0.2); }
    .badge-orange { background: rgba(234,88,12,0.22);  color: #fb923c; border: 1px solid rgba(251,146,60,0.2); }

    /* ── MESSAGES ── */
    .messages { list-style: none; padding: 0; margin: 0 0 16px; }
    .messages li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 18px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      border-width: 1px;
      border-style: solid;
      backdrop-filter: blur(8px);
    }
    .messages li::before { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
    .messages li.success  { background: rgba(22,163,74,0.15);  color: #4ade80; border-color: rgba(74,222,128,0.25); }
    .messages li.success::before { content: "✓"; }
    .messages li.error    { background: rgba(220,38,38,0.15);  color: #f87171; border-color: rgba(248,113,113,0.25); }
    .messages li.error::before { content: "✕"; }
    .messages li.warning  { background: rgba(234,179,8,0.15);  color: #fde047; border-color: rgba(253,224,71,0.25); }
    .messages li.warning::before { content: "⚠"; }
    .messages li.info, .messages li:not([class]) {
      background: rgba(99,102,241,0.15); color: #a5b4fc; border-color: rgba(165,180,252,0.25);
    }
    .messages li.info::before, .messages li:not([class])::before { content: "ℹ"; }

    /* ── FILTER TABS ── */
    .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-tabs a {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all .15s;
    }
    .filter-tabs a:hover { color: #fff; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    .filter-tabs a.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 3px 10px rgba(102,126,234,0.35);
    }

    /* ── SCORES ── */
    .score { font-weight: 800; font-size: 14px; }
    .score-high { color: #4ade80; }
    .score-mid  { color: #fbbf24; }
    .score-low  { color: #f87171; }
    .score-none { color: rgba(255,255,255,0.25); font-style: italic; font-weight: 400; }

    /* ── CRITERIA / BLOCO ── */
    .bloco-section { margin-bottom: 0; }
    .bloco-header {
      font-size: 11px;
      font-weight: 800;
      color: #a78bfa;
      text-transform: uppercase;
      letter-spacing: .7px;
      margin-bottom: 10px;
      padding: 9px 14px;
      background: rgba(102,126,234,0.12);
      border-radius: 8px;
      border-left: 3px solid #667eea;
    }
    .criterio-row {
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      margin-bottom: 8px;
      background: rgba(0,0,0,0.15);
      transition: border-color .15s, background .15s;
    }
    .criterio-row:focus-within { border-color: rgba(102,126,234,0.5); background: rgba(102,126,234,0.06); }
    .criterio-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .criterio-inputs { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: start; }
    .peso-badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(99,102,241,0.2);
      color: #a5b4fc;
      padding: 2px 9px;
      border-radius: 999px;
      flex-shrink: 0;
      border: 1px solid rgba(165,180,252,0.15);
    }

    /* ── MISC ── */
    a { color: #a78bfa; text-decoration: none; }
    a:hover { color: #c4b5fd; }
    .link-action {
      color: #a78bfa;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 7px;
      transition: background .15s, color .15s;
    }
    .link-action:hover { background: rgba(167,139,250,0.15); color: #c4b5fd; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      transition: color .15s;
    }
    .back-link:hover { color: rgba(255,255,255,0.75); }
    .section-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 5px;
    }
    .section-meta a { color: #818cf8; }
    .section-meta a:hover { color: #a5b4fc; }
    .text-muted { color: rgba(255,255,255,0.4); }
    .text-sm { font-size: 12px; }
    .mb-0 { margin-bottom: 0; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .container { padding: 0 14px; margin-top: 18px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .criterio-inputs { grid-template-columns: 1fr; }
      nav { padding: 0 16px; }
      .nav-links a { padding: 5px 7px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="{% url 'home' %}" class="nav-brand">AE <span>Evaluation</span></a>
      <div class="nav-links">
        <a href="{% url 'home' %}">Dashboard</a>
      </div>
    </div>
    <div class="nav-right">
      {% if user.is_authenticated %}
        <span>{{ user.email }}</span>
        <span class="nav-divider">·</span>
        <a href="{% url 'logout' %}">Sair</a>
      {% else %}
        <a href="{% url 'login' %}">Entrar</a>
      {% endif %}
    </div>
  </nav>

  <div class="container">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
